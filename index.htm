<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>いちたかっこいい</title>

<style>
body{
    font-family:system-ui,sans-serif;
    margin:20px;
}

audio{
    width:min(640px,100%);
}

.controls{
    margin-top:12px;
}

.wav-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:15px 0;
}

.wav-buttons button{
    padding:8px 16px;
    font-size:15px;
    cursor:pointer;
}

.status{
    margin-top:8px;
    font-size:14px;
    color:#555;
}
</style>
</head>

<body>

<h2>いちたかっこいい。</h2>

<!-- ファイル選択はそのまま残す -->
<input
    type="file"
    id="audioFile"
    accept="audio/*"
    onchange="loadAudio(event)"
>

<br><br>

<audio id="audioPlayer" controls></audio>

<div class="status" id="status">
現在の音声：なし
</div>

<!-- 1.wav ～ 10.wav -->
<div class="wav-buttons">
    <button onclick="loadNumberedAudio(1)">手紙　合唱</button>
    <button onclick="loadNumberedAudio(2)">手紙　ソプラノ</button>
    <button onclick="loadNumberedAudio(3)">手紙　アルト</button>
    <button onclick="loadNumberedAudio(4)">手紙　テノール</button>
    <button onclick="loadNumberedAudio(5)">手紙　カラピアノ</button>
    <button onclick="loadNumberedAudio(6)">春に　合唱</button>
    <button onclick="loadNumberedAudio(7)">春に　ソプラノ</button>
    <button onclick="loadNumberedAudio(8)">春に　アルト</button>
    <button onclick="loadNumberedAudio(9)">春に　テノール</button>
    <button onclick="loadNumberedAudio(10)">春に　カラピアノ</button>
</div>

<div class="controls">

<label>
再生速度：
<select id="playbackSpeedControl" onchange="setPlaybackSpeed(event)">
    <option value="0.125">12.5%</option>
    <option value="0.25">25%</option>
    <option value="0.375">37.5%</option>
    <option value="0.5">50%</option>
    <option value="0.625">62.5%</option>
    <option value="0.75">75%</option>
    <option value="0.875">87.5%</option>
    <option value="1" selected>100%</option>
    <option value="2">200%</option>
    <option value="4">400%</option>
    <option value="8">800%</option>
    <option value="16">1600%</option>
    <option value="32">3200%</option>
</select>
</label>

<br>

<label>
音量：
<select id="volumeControl" onchange="setVolume(event)">
    <option value="10">10%</option>
    <option value="20">20%</option>
    <option value="30">30%</option>
    <option value="40">40%</option>
    <option value="50">50%</option>
    <option value="60">60%</option>
    <option value="70">70%</option>
    <option value="80">80%</option>
    <option value="90">90%</option>
    <option value="100" selected>100%</option>
    <option value="200">200%</option>
    <option value="300">300%</option>
    <option value="400">400%</option>
    <option value="500">500%</option>
    <option value="600">600%</option>
    <option value="700">700%</option>
    <option value="800">800%</option>
    <option value="900">900%</option>
    <option value="1000">1000%</option>
</select>
</label>

</div>

<script>

const audioElement = document.getElementById("audioPlayer");
const statusElement = document.getElementById("status");

let audioContext = null;
let gainNode = null;
let sourceNode = null;


/* =========================================
   AudioContext初期化
========================================= */

function initAudioContext(){

    if(audioContext){
        return;
    }

    audioContext =
        new (window.AudioContext || window.webkitAudioContext)();

    sourceNode =
        audioContext.createMediaElementSource(audioElement);

    gainNode =
        audioContext.createGain();

    sourceNode
        .connect(gainNode)
        .connect(audioContext.destination);

    console.log("[Audio] AudioContext initialized");
}


/* =========================================
   ファイル選択
========================================= */

function loadAudio(event){

    const audioFile = event.target.files[0];

    if(!audioFile){
        alert("音声ファイルを選択してください。");
        return;
    }

    initAudioContext();

    const url = URL.createObjectURL(audioFile);

    audioElement.src = url;

    statusElement.textContent =
        "現在の音声：" + audioFile.name;

    console.log(
        "[Audio] ファイル読み込み:",
        audioFile.name,
        audioFile.type,
        audioFile.size + " bytes"
    );
}


/* =========================================
   1.wav ～ 10.wav
========================================= */

function loadNumberedAudio(number){

    const filename = number + ".mp3";

    console.log("[Audio] 読み込み開始:", filename);

    initAudioContext();

    audioElement.src = filename;

    statusElement.textContent =
        "現在の音声：" + filename;

    audioElement.load();

    console.log("[Audio] 音声セット:", filename);
}


/* =========================================
   再生速度
========================================= */

function setPlaybackSpeed(event){

    const speed = Number(event.target.value);

    audioElement.playbackRate = speed;

    console.log(
        "[Audio] 再生速度:",
        speed
    );
}


/* =========================================
   音量
========================================= */

function setVolume(event){

    initAudioContext();

    if(audioContext.state === "suspended"){
        audioContext.resume();
    }

    const volume =
        Number(event.target.value) / 100;

    gainNode.gain.value = volume;

    console.log(
        "[Audio] 音量:",
        event.target.value + "%"
    );
}


/* =========================================
   初期設定
========================================= */

audioElement.playbackRate = 1;

</script>

</body>
</html>
